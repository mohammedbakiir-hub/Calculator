<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; }
        .calculator { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 5px 0; font-size: 16px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Kalkulator</h2>
    <input type="number" id="num1" placeholder="Angka pertama">
    <input type="number" id="num2" placeholder="Angka kedua">
    <button onclick="tambah()">Tambah (+)</button>
    <h3 id="hasil">Hasil: </h3>
</div>

<script>
    function tambah() {
        let n1 = parseFloat(document.getElementById('num1').value) || 0;
        let n2 = parseFloat(document.getElementById('num2').value) || 0;
        let total = n1 + n2;
        document.getElementById('hasil').innerText = "Hasil: " + total;
    }
</script>

</body>
</html>
