<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Estetik</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: linear-gradient(135deg, #1e1e2f, #2d2b42); 
            margin: 0; 
        }
        .calculator { 
            background: #252336; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            width: 300px; 
        }
        .app-title {
            color: #fff;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        #display { 
            width: 100%; 
            height: 60px; 
            background: #181622; 
            color: #fff;
            font-size: 24px; 
            text-align: right; 
            padding: 10px; 
            box-sizing: border-box; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            border: 1px solid #3a3750; 
        }
        .buttons { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; 
        }
        button { 
            padding: 14px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            background: #36334c; 
            color: #e2e2e2; 
            transition: 0.2s; 
        }
        button:hover { background: #4c486a; }
        .operator { background: #ff9f43; color: #fff; }
        .operator:hover { background: #e08b35; }
        .clear { background: #ff5252; color: #fff; }
        .clear:hover { background: #e04444; }
        .function { background: #48dbfb; color: #1e1e2f; }
        .function:hover { background: #37c3df; }
        .equal { background: #1dd1a1; color: #fff; grid-column: span 2; }
        .equal:hover { background: #10ac84; }
    </style>
</head>
<body>

<div class="calculator">
    <div class="app-title">Calculator</div>
    <input type="text" id="display" readonly>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="function" onclick="backspace()">⌫</button>
        <button class="function" onclick="appendValue('(')">(</button>
        <button class="function" onclick="appendValue(')')">)</button>
        
        <button class="function" onclick="appendSquare()">x²</button>
        <button class="function" onclick="appendSqrt()">√</button>
        <button class="operator" onclick="appendValue('÷')">÷</button>
        <button class="operator" onclick="appendValue('×')">×</button>
        
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('-')">-</button>
        
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('+')">+</button>
        
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button onclick="appendValue('.')">.</button>
        
        <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(val) {
        display.value += val;
    }

    function clearDisplay() {
        display.value = '';
    }

    function backspace() {
        display.value = display.value.slice(0, -1);
    }

    function appendSquare() {
        if (display.value !== '') {
            display.value = `(${display.value})**2`;
            calculate();
        }
    }

    function appendSqrt() {
        display.value += 'Math.sqrt(';
    }

    function calculate() {
        try {
            // Ubah simbol visual ke operator JavaScript asli sebelum dihitung
            let expression = display.value
                .replace(/×/g, '*')
                .replace(/÷/g, '/');
            
            let result = eval(expression);
            display.value = Number.isFinite(result) ? result : 'Error';
        } catch (error) {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
